<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5146d8"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>ProofStream — Choose a new password</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="alternate icon" href="/favicon.ico"><link rel="stylesheet" href="/styles.css"></head><body class="register-body">
<main class="register-shell" id="main">
<a href="/" class="brand"><span class="brandmark">p<span>≈</span></span>ProofStream</a>
<div class="panel register-panel">
<span class="eyebrow">CREATOR WORKSPACE</span>
<h1>Choose a new password.</h1>
<form id="reset-form" novalidate>
<label>New password<input name="password" id="reset-password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label>
<p class="form-note">At least 10 characters. Saving it signs you out on every other device.</p>
<button type="submit" class="primary full" id="reset-submit">Save password ↗</button>
<p class="form-error" role="alert"></p>
</form>
<a class="text-button" href="/">Back to sign in</a>
</div>
</main>
<script src="/reset.js" defer></script>
</body></html>
